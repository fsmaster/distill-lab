# fsmaster.com/distill — Distill Lab (github.com/fsmaster/distill-lab)
# Installed to /etc/nginx/snippets/distill.conf and included from the fsmaster vhost.
# COOP/COEP make the page cross-origin isolated so wllama can use multi-threaded WASM;
# "credentialless" keeps Google Fonts / Tailwind CDN working without CORP headers.
location = /distill { return 301 /distill/; }
location ^~ /distill/ {
    alias /var/www/distill/;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/wasm;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location ~* \.gguf$ {
        gzip off;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location ~* \.(wasm|mjs)$ {
        types { application/wasm wasm; text/javascript mjs; }
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
